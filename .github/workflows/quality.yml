name: Product Passport quality
on:
  push:
    branches: [main, review/product-passport]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wordpress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            wordpress: '6.8.3'
            woo: '10.3.6'
          - php: '8.3'
            wordpress: '7.1.4'
            woo: '11.0.0'
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress-test
          MARIADB_ROOT_PASSWORD: root-test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, fileinfo, iconv, zip, gd
          tools: wp-cli, phpcs
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Syntax and code layout
        run: |
          find giuliomax-product-passport -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check giuliomax-product-passport/assets/admin.js
          node --check giuliomax-product-passport/assets/block.js
          phpcs --standard=phpcs.xml
      - name: Install WordPress on MariaDB
        env:
          QA_WP: ${{ matrix.wordpress }}
        run: |
          wp core download --version="$QA_WP" --path="$RUNNER_TEMP/wp" --force
          wp config create --path="$RUNNER_TEMP/wp" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress-test --dbhost=127.0.0.1:3306
          wp core install --path="$RUNNER_TEMP/wp" --url=http://127.0.0.1:8080 --title=QA --admin_user=admin --admin_password=password --admin_email=admin@example.test --skip-email
          sudo ln -s "$RUNNER_TEMP/wp" /wordpress
          cp -R giuliomax-product-passport "$RUNNER_TEMP/wp/wp-content/plugins/"
      - name: Functional regression suite on MariaDB
        run: |
          php tests/harness.php > "$RUNNER_TEMP/backend.json"
          node - "$RUNNER_TEMP/backend.json" <<'JS'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[2]));for(const t of r.tests)console.log((t.ok?'PASS ':'FAIL ')+t.name+(t.error?' — '+t.error:''));if(r.tests.some(t=>!t.ok))process.exit(1);console.log(JSON.stringify({php:r.php,wordpress:r.wordpress,total:r.tests.length}));
          JS
      - name: WordPress.org Plugin Check
        run: |
          wp plugin install plugin-check --activate --path="$RUNNER_TEMP/wp"
          wp plugin check giuliomax-product-passport --path="$RUNNER_TEMP/wp" --format=strict-json --fields=file,line,column,type,code,message > "$RUNNER_TEMP/plugin-check.json" || true
          node - "$RUNNER_TEMP/plugin-check.json" <<'JS'
          const fs=require('fs');const raw=fs.readFileSync(process.argv[2],'utf8');const r=raw.startsWith('Success:')?[]:JSON.parse(raw);console.log(JSON.stringify(r,null,2));const rows=Array.isArray(r)?r:Object.values(r).flat();if(rows.some(x=>String(x.type||x.severity).toLowerCase()==='error'))process.exit(1);
          JS
      - name: Install the distribution ZIP
        if: always()
        run: |
          python3 scripts/package.py
          if git ls-files --error-unmatch dist/giuliomax-product-passport-1.0.1.zip > /dev/null 2>&1; then
            git diff --exit-code -- dist/giuliomax-product-passport-1.0.1.zip dist/SHA256SUMS
          fi
          wp plugin deactivate giuliomax-product-passport --path="$RUNNER_TEMP/wp"
          wp plugin delete giuliomax-product-passport --path="$RUNNER_TEMP/wp"
          wp plugin install dist/giuliomax-product-passport-1.0.1.zip --activate --path="$RUNNER_TEMP/wp"
      - name: WooCommerce and Action Scheduler regressions
        if: always()
        env:
          QA_WOO: ${{ matrix.woo }}
        run: |
          wp plugin install woocommerce --version="$QA_WOO" --activate --path="$RUNNER_TEMP/wp"
          php tests/woo.php > "$RUNNER_TEMP/woo.json"
          node - "$RUNNER_TEMP/woo.json" <<'JS'
          const r=JSON.parse(require('fs').readFileSync(process.argv[2]));console.log(JSON.stringify(r,null,2));if(r.tests.some(t=>!t.ok))process.exit(1);
          JS
      - name: Browser regression suite
        if: always()
        env:
          QA_WP: ${{ matrix.wordpress }}
          QA_PHP: ${{ matrix.php }}
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          export QA_CHROME="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          QA_BROWSER=1 node tests/run.mjs
          node tests/qr-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-php${{ matrix.php }}-wp${{ matrix.wordpress }}
          path: |
            ${{ runner.temp }}/backend.json
            ${{ runner.temp }}/woo.json
            ${{ runner.temp }}/plugin-check.json
            test-results/backend.json
            test-results/browser.json
            test-results/qr-decode.json
